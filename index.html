<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ledger · Dawn</title>
<meta name="description" content="The Ledger: a solo World of Warcraft Classic server’s data beside every change made to it.">
<meta name="theme-color" content="#15100a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Marcellus&display=swap">
<link rel="stylesheet" href="assets/ledger/css/tokens.css?v=1">
<link rel="stylesheet" href="assets/ledger/css/material.css?v=1">
<link rel="stylesheet" href="assets/ledger/css/shell.css?v=1">
<link rel="stylesheet" href="assets/ledger/css/page.css?v=1">
<link rel="stylesheet" href="assets/ledger/css/entries.css?v=1">
</head>
<body>
<!--
THESIS: The server's account book: golden parchment folios bound in WoW Forever's dark, gold-rimmed frame; each entry a ruled ledger
line under a double rubric rule. Refuses the dark dashboard of same-size cards.
OWN-WORLD: Leather rail with a twisted gold cord; honey parchment, sepia ink, rubric red rules; Marcellus capitals, Alegreya text;
one colour a status, ink-stamp pills.
STORY: The player (and visitors) see what the server is now, what we changed and why, and how hard each change is, then open an entry.
FIRST VIEWPORT: The rail left (name, search, sections); the page right: the title over its double rule, the preface, the contents
with dotted leaders to each section's count.
FORM: Brief-pinned (Forever UI with a parchment motif), not rolled. Seed: pinned.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="shell">
  <header class="topbar leather">
    <a class="brand" href="#/"><span class="bt">The Ledger</span></a>
    <button class="menubtn" type="button" aria-controls="rail" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>Sections</button>
  </header>
  <aside class="rail leather" id="rail" aria-label="The Ledger">
    <a class="brand" href="#/"><span class="bt">The Ledger</span><span class="bs">World of Warcraft – Dawn</span></a>
    <div class="cord" aria-hidden="true"></div>
    <div class="find" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4 14 14"/></svg>
      <input type="search" id="find" placeholder="Find anything…" aria-label="Find an item, creature, quest, change…" autocomplete="off" aria-controls="found" aria-expanded="false">
      <kbd>/</kbd>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <p class="railfoot" id="railfoot"></p>
  </aside>
  <div class="scrim" aria-hidden="true"></div>
  <div class="desk">
    <main class="sheet paper" id="page"><p class="empty">Opening the ledger…</p></main>
    <footer class="deskfoot" id="deskfoot"></footer>
  </div>
</div>
<div class="found paper" id="found" role="listbox" hidden></div>
<script type="module" src="assets/ledger/main.js?v=9"></script>
</body>
</html>
